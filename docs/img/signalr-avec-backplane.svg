<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AVEC le backplane Redis : toutes les instances partagent les messages</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#475569">Redis relaie chaque message SignalR à toutes les instances, et garde la liste des participants en commun.</text>

  <!-- Répartiteur -->
  <rect x="350" y="80" width="300" height="42" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="500" y="106" text-anchor="middle" font-size="14" fill="#0f172a">Répartiteur de charge (load balancer)</text>
  <line x1="420" y1="122" x2="230" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#gr)"/>
  <line x1="580" y1="122" x2="770" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#gr)"/>

  <!-- Instance A -->
  <rect x="40" y="162" width="300" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Instance A</text>
  <text x="190" y="216" text-anchor="middle" font-size="13" fill="#0f172a">Hub SignalR + AddStackExchangeRedis</text>
  <text x="190" y="240" text-anchor="middle" font-size="13" fill="#0f172a">RedisSessionPresenceTracker</text>
  <text x="190" y="264" text-anchor="middle" font-size="12" fill="#64748b">1. reçoit « suivant » de l'animateur</text>

  <!-- Instance B -->
  <rect x="660" y="162" width="300" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="810" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Instance B</text>
  <text x="810" y="216" text-anchor="middle" font-size="13" fill="#0f172a">Hub SignalR + AddStackExchangeRedis</text>
  <text x="810" y="240" text-anchor="middle" font-size="13" fill="#0f172a">RedisSessionPresenceTracker</text>
  <text x="810" y="264" text-anchor="middle" font-size="12" fill="#64748b">3. reçoit le message de Redis</text>

  <!-- Redis -->
  <rect x="380" y="206" width="240" height="190" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="234" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Redis</text>
  <text x="500" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Pub/Sub (backplane)</text>
  <text x="500" y="282" text-anchor="middle" font-size="12" fill="#0f172a">canaux « ConnectLive… »</text>
  <line x1="400" y1="300" x2="600" y2="300" stroke="#fca5a5"/>
  <text x="500" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Clés de présence</text>
  <text x="500" y="344" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#0f172a">connectlive:presence:conn:*</text>
  <text x="500" y="362" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#0f172a">connectlive:presence:session:*</text>
  <text x="500" y="384" text-anchor="middle" font-size="11.5" fill="#64748b">expirent après 12 h</text>

  <!-- Flèches A -> Redis -> B -->
  <line x1="340" y1="236" x2="380" y2="236" stroke="#2563eb" stroke-width="3" marker-end="url(#gr)"/>
  <circle cx="360" cy="214" r="13" fill="#2563eb"/><text x="360" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <line x1="620" y1="236" x2="660" y2="236" stroke="#2563eb" stroke-width="3" marker-end="url(#gr)"/>
  <circle cx="640" cy="214" r="13" fill="#2563eb"/><text x="640" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>

  <!-- Clients -->
  <rect x="80" y="450" width="220" height="56" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="476" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Alice (navigateur)</text>
  <text x="190" y="495" text-anchor="middle" font-size="12" fill="#14532d">connectée à A</text>
  <rect x="700" y="450" width="220" height="56" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="810" y="476" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Bob (navigateur)</text>
  <text x="810" y="495" text-anchor="middle" font-size="12" fill="#14532d">connecté à B</text>

  <line x1="190" y1="282" x2="190" y2="448" stroke="#16a34a" stroke-width="3" marker-end="url(#ok)"/>
  <text x="204" y="372" font-size="13" font-weight="700" fill="#15803d">✔ QuestionChanged</text>
  <line x1="810" y1="282" x2="810" y2="448" stroke="#16a34a" stroke-width="3" marker-end="url(#ok)"/>
  <text x="824" y="372" font-size="13" font-weight="700" fill="#15803d">✔ QuestionChanged</text>
  <circle cx="190" cy="415" r="13" fill="#16a34a"/><text x="190" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <circle cx="810" cy="415" r="13" fill="#16a34a"/><text x="810" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>

  <text x="500" y="436" text-anchor="middle" font-size="13" fill="#334155">JoinSession(…) sur B renvoie « Alice, Bob » :</text>
  <text x="500" y="456" text-anchor="middle" font-size="13" fill="#334155">la présence vient de Redis, plus de la mémoire locale.</text>

  <text x="500" y="540" text-anchor="middle" font-size="12" fill="#64748b">Vérifié par SignalRBackplaneTests : deux serveurs d'API, un Redis réel, un client SignalR sur chaque serveur.</text>
</svg>
