<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Postgres dans Docker : une seule base pour le développement, les tests et la production</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#475569">Deux façons de lancer l'API — la base est toujours le même conteneur Postgres 16.</text>

  <!-- Zone Docker -->
  <rect x="470" y="86" width="510" height="486" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="725" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Docker Desktop — réseau « connectline-network »</text>

  <rect x="500" y="132" width="450" height="130" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="725" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">connectlive-db  (postgres:16-alpine)</text>
  <text x="725" y="186" text-anchor="middle" font-size="13" fill="#0f172a">base « connectlive » · utilisateur « connectlive »</text>
  <text x="725" y="208" text-anchor="middle" font-size="13" fill="#0f172a">volume « data-postgres » : les données survivent aux redémarrages</text>
  <text x="725" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">port 5432 dans Docker  →  5433 sur votre machine</text>

  <rect x="500" y="290" width="450" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="725" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">connectlive-core-api  (option B)</text>
  <text x="725" y="344" text-anchor="middle" font-size="13" fill="#0f172a">ConnectionStrings__ConnectLiveContext =</text>
  <text x="725" y="364" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#0f172a">Host=connectlive-db;Port=5432;Database=connectlive;…</text>

  <rect x="500" y="414" width="215" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="607" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">redis :6379</text>
  <text x="607" y="464" text-anchor="middle" font-size="12" fill="#0f172a">cache + backplane SignalR</text>
  <rect x="735" y="414" width="215" height="70" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="842" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">rabbitmq :5672</text>
  <text x="842" y="464" text-anchor="middle" font-size="12" fill="#0f172a">bus d'événements (UI :15672)</text>
  <rect x="500" y="502" width="215" height="52" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="607" y="534" text-anchor="middle" font-size="13" fill="#0f172a">adminer :8082 (voir la base)</text>
  <rect x="735" y="502" width="215" height="52" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="842" y="534" text-anchor="middle" font-size="13" fill="#0f172a">seq :8199 (journaux)</text>

  <!-- Option A : machine hôte -->
  <rect x="24" y="86" width="400" height="300" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="224" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Votre machine — option A (recommandée)</text>
  <rect x="50" y="132" width="348" height="104" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="224" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Visual Studio / dotnet run</text>
  <text x="224" y="184" text-anchor="middle" font-size="13" fill="#0f172a">ConnectLive.Core.Api  http://localhost:5101</text>
  <text x="224" y="206" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#0f172a">Host=localhost;Port=5433;…  (appsettings.Development)</text>
  <text x="224" y="226" text-anchor="middle" font-size="12" fill="#475569">débogage, rechargement à chaud</text>
  <text x="224" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Au démarrage (Development) :</text>
  <text x="224" y="292" text-anchor="middle" font-size="13" fill="#0f172a">Database.Migrate() applique les</text>
  <text x="224" y="312" text-anchor="middle" font-size="13" fill="#0f172a">migrations EF Core en attente</text>
  <text x="224" y="342" text-anchor="middle" font-size="12" fill="#64748b">(désactivable : Database__MigrateOnStartup=false)</text>

  <line x1="398" y1="184" x2="500" y2="196" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="442" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">:5433</text>

  <line x1="725" y1="290" x2="725" y2="262" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="742" y="280" font-size="12" font-weight="700" fill="#334155">:5432</text>

  <!-- Production / CI -->
  <rect x="24" y="414" width="400" height="140" rx="16" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="224" y="442" text-anchor="middle" font-size="16" font-weight="700" fill="#581c87">Production et CI</text>
  <text x="224" y="470" text-anchor="middle" font-size="13" fill="#0f172a">Même moteur Postgres (jamais SQLite).</text>
  <text x="224" y="492" text-anchor="middle" font-size="13" fill="#0f172a">Production : on recommande d'appliquer les migrations dans une</text>
  <text x="224" y="512" text-anchor="middle" font-size="13" fill="#0f172a">étape de déploiement (pas au démarrage).</text>
  <text x="224" y="538" text-anchor="middle" font-size="12" fill="#64748b">CI : service Postgres + tests de migration</text>
</svg>
