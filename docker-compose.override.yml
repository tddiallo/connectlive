version: '3.4'

services:
  seq:
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - 8199:80

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  redis:
    restart: always
    container_name: redis
    ports:
      - 6379:6379

  connectlive-db:
    restart: always
    container_name: connectlive-db
    environment:
      POSTGRES_USER: connectlive
      POSTGRES_PASSWORD: Password1
      POSTGRES_DB: connectlive
    ports:
      - 5433:5432
    volumes:
      - data-postgres:/var/lib/postgresql/data

  adminer:
    restart: always
    container_name: adminer
    ports:
      - 8082:8080

  connectlive.core.api:
    container_name: connectlive-core-api
    restart: on-failure
    depends_on:
      - connectlive-db
      - rabbitmq
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - EventBusUsername=user
      - EventBusPassword=password
      - EventBusConnection=rabbitmq://rabbitmq:5672
      - ConnectionStrings__Redis=redis:6379
    ports:
      - 8080:8080

  connectlive.notification.api:
    container_name: connectlive-notification-api
    restart: on-failure
    depends_on:
      - connectlive-db
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - EventBusUsername=user
      - EventBusPassword=password
      - EventBusConnection=rabbitmq://rabbitmq:5672
    ports:
      - "8083:8080"

  connectlive.newsletter.api:
    restart: on-failure
    depends_on:
      - connectlive-db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8085:8080"
