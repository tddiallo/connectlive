version: '3.4'

services:
  seq:
    image: datalust/seq:latest
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.1
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_management && rabbitmq-server"
    ports:
      - "15672:15672"
    networks:
       - backend

  redis:
    image: redis:7-alpine
    networks:
      - backend

  connectlive-db:
    image: postgres:16-alpine
    networks:
      - backend

  adminer:
    image: adminer
    networks:
      - backend

  connectlive.core.api:
    image: ${DOCKER_REGISTRY-}connectlive-core-api
    build:
      context: ..
      dockerfile: ConnectLive.Core/ConnectLive.Core/Dockerfile
    networks:
      - backend

  connectlive.notification.api:
    image: ${DOCKER_REGISTRY-}connectlive-notification-api
    build:
      context: ..
      dockerfile: ConnectLive.Core/ConnectLive.Notification.Api/Dockerfile
    networks:
      - backend

  connectlive.newsletter.api:
    image: ${DOCKER_REGISTRY-}connectlivenewsletterapi
    build:
      context: ..
      dockerfile: ConnectLive.Core/ConnectLive.Newsletter.Api/Dockerfile
    networks:
      - backend


networks:
  backend:
    name: connectline-network

volumes:
  data-postgres:
  


